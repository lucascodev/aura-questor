name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color -q

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua
        # O espelho Azure dos runners cai com frequencia e o apt fica pendurado
        # nele sem limite; espelho oficial, retries e timeout curto no job.
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lua5.4
      - name: Core tests
        run: lua5.4 Tests/Run.lua
