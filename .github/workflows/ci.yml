name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Core tests
        run: lua5.4 Tests/Run.lua
